name: Pull request build
on:
  pull_request:
    branches: ['main']
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Packages
        run: yarn install
      - name: Build
        run: yarn build && node scripts/check-case-themes.cjs && node scripts/test-portfolio-interactions.cjs && node scripts/test-workflow-demo.cjs && node scripts/test-design-system.cjs && node scripts/test-retina-assets.cjs && node scripts/test-project-entry.cjs && node scripts/test-hiring-focus.cjs && node scripts/test-project-journeys.cjs
