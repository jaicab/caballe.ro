name: Test
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js '20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Packages
        run: yarn install
      - name: Build
        run: yarn build && node scripts/check-case-themes.cjs && node scripts/test-portfolio-interactions.cjs && node scripts/test-workflow-demo.cjs
