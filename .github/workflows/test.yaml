name: Test
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js '20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Packages
        run: yarn install
      - name: Build
        run: yarn build && node scripts/check-case-themes.cjs && node scripts/test-portfolio-interactions.cjs && node scripts/test-workflow-demo.cjs && node scripts/test-design-system.cjs && node scripts/test-retina-assets.cjs && node scripts/test-project-entry.cjs && node scripts/test-hiring-focus.cjs && node scripts/test-project-journeys.cjs && node scripts/test-caballeros-demo.cjs && node scripts/test-page-theme.cjs && node scripts/test-tiny-details.cjs && node scripts/test-home-layout.cjs
      - name: Private session boundary and lifecycle tests
        run: node scripts/test-portfolio-session.cjs
